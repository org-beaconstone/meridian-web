# Bug work-item template.
#
# target-repo decisions:
# - Required. The destination repository is its own fact, so target-repo is
#   listed under required. Where stays optional.
# - Beside Where. Where still carries a Repo label next to file paths.
# - Plain repository name. The heading is the label, so the value has no
#   Repo prefix.
kind: work-item
name: bug
required:
  - target-repo
fields:
  - name: why
    heading: Why
    guidance: Describe the defect and why it needs a fix.
  - name: target-repo
    heading: Target repo
    guidance: Name the one repository the fix belongs to. Write the repository name only, with no Repo label. This field is required and sits beside Where.
  - name: where
    heading: Where
    guidance: Optional. Keep a Repo label alongside the file paths or surfaces involved. Do not use this field in place of Target repo.
  - name: acceptance-criteria
    heading: Acceptance criteria
    guidance: List what must be true when the bug is fixed.
  - name: verification
    heading: Verification
    guidance: State the commands or review that show the fix holds.
  - name: out-of-scope
    heading: Out of scope
    guidance: List changes this bug must leave alone.
  - name: open-questions
    heading: Open questions
    guidance: List questions that are still open. Remove a question once it is decided.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve static assets with cache headers
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Proxy API requests to backend (Docker Compose service name).
  # A gateway timeout is JSON so the portal can show a timeout, not an invalid-response error.
  location /api/v1/ {
    proxy_pass http://api:8080/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 20s;
    proxy_read_timeout 20s;
    proxy_intercept_errors on;
    error_page 408 504 = @api_timeout;
  }

  location @api_timeout {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 504 '{"ok":false,"error":"The service timed out before it could respond. Try again.","code":"TIMEOUT"}';
  }

  # SPA fallback: serve index.html for all non-file requests
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
